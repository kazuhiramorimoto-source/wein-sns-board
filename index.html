<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="logos/yoake-icon.png">
<link rel="apple-touch-icon" href="logos/yoake-icon.png">
<meta name="theme-color" content="#0d0d0d">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap" rel="stylesheet">
<title>YOAKE スクール横串オーガニック｜スケジュール & KPI進捗</title>
<style>
  :root{
    --bg:#eef1f5; --surface:#ffffff; --surface-2:#f4f6f9; --surface-3:#e7ebf1;
    --border:#dee3ea; --border-strong:#c5ccd7;
    --ink:#181b21; --ink-2:#565e6c; --ink-3:#8b93a2;
    --accent:#4a57c9; --accent-soft:#e9ebfb; --accent-ink:#3742a1;
    --good:#1a9d5b; --good-soft:#e3f4eb; --good-ink:#127a45;
    --warn:#d67d12; --warn-soft:#fbeed8; --warn-ink:#985807;
    --bad:#dd3b3b; --bad-soft:#fbe7e7; --bad-ink:#b32424;
    --shadow:0 1px 2px rgba(20,24,33,.05); --shadow-lg:0 12px 34px rgba(20,24,33,.14);
    --mono:"SF Mono",ui-monospace,Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",YuGothic,"Noto Sans JP",sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0f1216; --surface:#171b21; --surface-2:#1e232b; --surface-3:#272d38;
      --border:#2b323d; --border-strong:#3c4450;
      --ink:#eef1f6; --ink-2:#a3abb9; --ink-3:#69717f;
      --accent:#8b9bff; --accent-soft:#1e2842; --accent-ink:#b6c2ff;
      --good:#3ed07e; --good-soft:#132a1e; --good-ink:#5fe19b;
      --warn:#f0a83a; --warn-soft:#30250f; --warn-ink:#f7c574;
      --bad:#f26a6a; --bad-soft:#331717; --bad-ink:#f79290;
      --shadow:0 1px 2px rgba(0,0,0,.45); --shadow-lg:0 12px 40px rgba(0,0,0,.6);
    }
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;
    -webkit-font-smoothing:antialiased;font-feature-settings:"palt" 1;font-size:14px;}
  .wrap{max-width:1180px;margin:0 auto;padding:24px 20px 90px;}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums;}
  button{font-family:var(--sans);cursor:pointer;}

  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
  .badge{background:var(--ink);color:var(--surface);font-size:10px;font-weight:800;letter-spacing:.13em;padding:3px 8px;border-radius:6px;}
  h1{font-size:17px;font-weight:800;margin:0;letter-spacing:-.01em;}
  .sub{font-size:10.5px;color:var(--ink-3);}
  .spacer{flex:1;}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:7px;white-space:nowrap;}
  .pill .d{width:6px;height:6px;border-radius:50%;}
  .p-done{background:var(--good-soft);color:var(--good-ink)} .p-done .d{background:var(--good)}

  .tabs{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:3px;gap:2px;margin-bottom:16px;flex-wrap:wrap;}
  .tabs button{border:none;background:transparent;color:var(--ink-2);font-size:12.5px;font-weight:700;padding:7px 14px;border-radius:8px;}
  .tabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);}
  .switch{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:2px;gap:2px;flex-wrap:wrap;}
  .switch button{border:none;background:transparent;font-size:11px;font-weight:700;color:var(--ink-3);padding:4px 11px;border-radius:7px;white-space:nowrap;}
  .switch button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);}
  .btn{border:1px solid var(--border-strong);background:var(--surface);color:var(--ink-2);font-size:12px;font-weight:700;padding:6px 12px;border-radius:9px;}

  .stag{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:2px 10px;border-radius:6px;color:#3d3d3d;border:1px solid rgba(0,0,0,.1);}
  .mb{display:inline-block;font-size:8.5px;font-weight:800;padding:1px 6px;border-radius:5px;background:var(--surface-3);color:var(--ink-2);letter-spacing:.03em;vertical-align:1px;white-space:nowrap;}
  .mb-x{background:#1a1a1a;color:#fff;}
  @media (prefers-color-scheme:dark){ .mb-x{background:#e8e8e8;color:#111;} }
  .mb-yt{background:#FDE3E1;color:#B3211B;} .mb-sh{background:#FCE7F3;color:#BE185D;}
  .sctag{display:inline-block;font-size:8.5px;font-weight:800;padding:1px 6px;border-radius:5px;background:var(--accent-soft);color:var(--accent-ink);white-space:nowrap;vertical-align:1px;}
  .lchip{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);border:1px solid var(--accent);text-decoration:none;margin-left:4px;white-space:nowrap;vertical-align:1px;}
  .lchip:hover{text-decoration:underline;}
  .cent .lchip{font-size:9.5px;padding:0 5px;margin-left:3px;}
  .sctag.tl{background:#F3E8FF;color:#7E22CE;}
  @media (prefers-color-scheme:dark){ .sctag.tl{background:#2d1b45;color:#d0aaff;} }
  .segrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;width:100%;}
  .seglbl{font-size:9.5px;font-weight:800;color:var(--ink-3);letter-spacing:.08em;min-width:64px;}

  /* calendar */
  .calhead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .calhead .cm{font-size:14.5px;font-weight:800;min-width:110px;text-align:center;}
  .calwrap{overflow-x:auto;}
  .cal{min-width:880px;display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);}
  .cal .ch{background:var(--surface-2);font-size:10px;font-weight:800;color:var(--ink-3);text-align:center;padding:6px 0;}
  .cal .ch.sun{color:var(--bad-ink)} .cal .ch.sat{color:var(--accent-ink)}
  .cday{background:var(--surface);min-height:112px;padding:5px 6px;font-size:11px;}
  .cday.out{background:var(--surface-2);}
  .cday .dnum{font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--ink-3);display:inline-flex;width:19px;height:19px;align-items:center;justify-content:center;border-radius:50%;}
  .cday.today .dnum{background:var(--accent);color:#fff;}
  .cent{display:block;margin-top:4px;line-height:1.45;background:var(--surface-2);border-left:3px solid var(--border-strong);border-radius:5px;padding:3px 6px;}
  .cent .ct{color:var(--ink);font-weight:600;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .cent .ct b{color:var(--ink);}

  /* list */
  .grp-h2{font-size:11px;font-weight:800;color:var(--ink-3);letter-spacing:.05em;padding:14px 18px 6px;}
  .tbl-scroll{overflow-x:auto;}
  table{border-collapse:collapse;width:100%;font-size:12px;}
  th,td{text-align:left;padding:9px 13px;border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:top;}
  th{font-size:9.5px;color:var(--ink-3);font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--surface-2);}
  tr:last-child td{border-bottom:none;}
  td.wr{white-space:normal;min-width:200px;max-width:360px;line-height:1.5;color:var(--ink);font-weight:600;}

  /* KPI */
  .kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px;}
  .kcard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:15px 17px;}
  .kcard .kh2{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .kcard .knm{font-size:15px;font-weight:800;letter-spacing:-.01em;}
  .kcard .kov{margin-left:auto;font-family:var(--mono);font-size:21px;font-weight:750;letter-spacing:-.02em;}
  .krow2{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--border);font-size:12.5px;}
  .krow2:last-child{border-bottom:none;}
  .krow2 .kn2{flex:1 0 100%;min-width:0;white-space:normal;line-height:1.35;color:var(--ink-2);font-weight:600;}
  .krow2 .kbar{flex:1 1 64px;width:auto;}
  .krow2 .kn2.cv{color:var(--accent-ink);font-weight:800;}
  .krow2 .kv2{font-family:var(--mono);font-size:11.5px;color:var(--ink);white-space:nowrap;}
  .krow2 .kv2 b{font-size:15px;letter-spacing:-.01em;}
  .krow2 .kv2 .tgt{color:var(--ink-3);font-size:10px;}
  .kbar{width:64px;height:8px;border-radius:4px;background:var(--surface-3);overflow:hidden;flex:none;}
  .kbar i{display:block;height:100%;border-radius:4px;}
  .b-good{background:var(--good)} .b-warn{background:var(--warn)} .b-bad{background:var(--bad)} .b-none{background:var(--ink-3)}
  .krow2 .kp2{font-family:var(--mono);font-size:12px;font-weight:800;min-width:54px;text-align:center;flex:none;padding:2.5px 8px;border-radius:999px;}
  .krow2 .kp2.c-good{background:color-mix(in srgb,var(--good) 13%,transparent);}
  .krow2 .kp2.c-warn{background:color-mix(in srgb,var(--warn) 16%,transparent);}
  .krow2 .kp2.c-bad{background:color-mix(in srgb,var(--bad) 12%,transparent);}
  .krow2 .kp2.c-none{background:var(--surface-3);}
  .ksec{margin:12px 0 1px;font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--ink-3);}
  .ksec+.krow2{border-top:none;}
  .kovwrap{margin-left:auto;text-align:right;flex:none;}
  .kovlbl{display:block;font-size:8.5px;font-weight:800;color:var(--ink-3);letter-spacing:.05em;}
  .c-good{color:var(--good-ink)} .c-warn{color:var(--warn-ink)} .c-bad{color:var(--bad-ink)} .c-none{color:var(--ink-3)}
  .note{font-size:11px;color:var(--ink-3);margin:10px 2px;line-height:1.7;}
  /* スクールハブ */
  .sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;}
  .scard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:15px 17px;cursor:pointer;transition:.15s;box-shadow:var(--shadow);}
  .scard:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow-lg);}
  .scard .sn2{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px;letter-spacing:-.01em;}
  .scard .sn2 .kov{margin-left:auto;font-size:16px;}
  .scard .steaser{font-size:10.5px;color:var(--ink-3);margin-top:9px;line-height:1.6;}
  .statrow{display:flex;gap:10px;margin-top:10px;}
  .stat{flex:1;background:var(--surface-2);border-radius:9px;padding:7px 11px;}
  .stat .sl{display:block;font-size:8.5px;font-weight:800;color:var(--ink-3);letter-spacing:.04em;margin-bottom:1px;}
  .stat .sv{font-family:var(--mono);font-size:17px;font-weight:750;letter-spacing:-.02em;}
  .sd-head{display:flex;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap;}
  .sd-head h2{font-size:21px;font-weight:800;margin:0;letter-spacing:-.01em;}
  .concept-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;}
  .cbox{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;}
  .cbox.hero{grid-column:1/-1;border-color:var(--accent);}
  .cbox .ci{font-size:10px;font-weight:800;letter-spacing:.07em;color:var(--accent-ink);margin-bottom:7px;text-transform:uppercase;}
  .cbox .cb{font-size:12.5px;line-height:1.85;color:var(--ink);white-space:pre-wrap;}
  .cbox.hero .cb{font-size:14px;font-weight:600;}
  .sec-h3{display:flex;align-items:baseline;gap:10px;margin:24px 0 10px;}
  .sec-h3 h3{font-size:13px;font-weight:800;margin:0;letter-spacing:.02em;}
  .sec-h3 .line{flex:1;height:1px;background:var(--border);}
  .fixrow{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px;}
  .fixrow:last-child{border-bottom:none;}
  .fixrow .tc{flex:none;font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);padding:1px 7px;border-radius:5px;margin-top:2px;}
  .fixrow .fx{flex:1;line-height:1.5;color:var(--ink);font-weight:600;min-width:0;}
  .fixrow .fx small{color:var(--ink-3);font-weight:500;}
  footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--border);font-size:10.5px;color:var(--ink-3);line-height:1.8;}
</style>
<style>
/* ---- readability polish v4 ---- */
.dmk{display:inline-block;width:13px;height:13px;border-radius:50%;background:#3a3f47;color:#fff;font-size:9px;font-weight:800;line-height:13px;text-align:center;margin-right:5px;vertical-align:-1.5px;}
.dmk::after{content:'✓';}
.dmk.half{background:transparent;border:1.5px solid #565e6c;color:#565e6c;line-height:10.5px;}
.cent.done{opacity:.75;}
.cent.done .ct{text-decoration:none;}
.ic{width:15px;height:15px;vertical-align:-2.5px;margin-right:5px;}
.tabs .ic{width:16px;height:16px;}
.cvmark{display:inline-block;font-size:8.5px;font-weight:800;background:var(--accent);color:#fff;border-radius:4px;padding:1px 5px;margin-right:5px;vertical-align:1px;letter-spacing:.05em;}
.gdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:0;}
.calhead .btn{display:inline-flex;align-items:center;}
.calhead .btn .ic{margin:0 2px;}
body{font-size:14.5px;}
h1{font-size:18px;}
.tabs button{font-size:13.5px;padding:9px 18px;}
.tabs button.on{color:var(--accent-ink);}
.switch button{font-size:11.5px;padding:5px 13px;}
.switch button.sc.on{background:var(--accent-soft);color:var(--accent-ink);}
.switch button.tl.on{background:#F3E8FF;color:#7E22CE;}
@media (prefers-color-scheme:dark){ .switch button.tl.on{background:#2d1b45;color:#d0aaff;} }
.cday{min-height:120px;font-size:11.5px;padding:6px 7px;}
.cday.wk{background:color-mix(in srgb, var(--surface) 94%, var(--accent) 6%);}
.cday.wk.out,.cday.out{background:var(--surface-2);}
.cday.today{outline:2px solid var(--accent);outline-offset:-2px;}
.cent{border-left:none;border-radius:6px;padding:3px 7px;margin-top:5px;}
.cent .ct{color:#2b2e33;font-weight:700;font-size:11px;}
.cent .ct b{color:#111;}
.grp-h2{font-size:12px;color:var(--ink-2);}
td.wr{font-size:12.5px;}
tbody tr:nth-child(even){background:color-mix(in srgb, var(--surface-2) 55%, var(--surface) 45%);}
.krow2{font-size:13px;padding:9px 0;}
.krow2 .kv2 b{font-size:16px;}
.kbar{width:88px;height:8px;border-radius:4px;}
.krow2 .kp2{font-size:13px;min-width:58px;}
.krow2.cvrow{background:var(--accent-soft);border-radius:8px;padding:8px 10px;border-bottom:none;margin:3px -4px;}
.ovbar{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;margin:2px 0 10px;}
.ovbar i{display:block;height:100%;border-radius:3px;}
.kcard .kov{font-size:23px;}
.kcard .knm{font-size:16px;}
.lgd{display:inline-flex;gap:12px;align-items:center;flex-wrap:wrap;}
.lgi{display:inline-flex;gap:5px;align-items:center;font-size:10.5px;font-weight:700;color:var(--ink-2);}
.lgi .ld{width:10px;height:10px;border-radius:3px;display:inline-block;}
.scard.sc{border-top:3px solid var(--accent);}
.scard.tl{border-top:3px solid #a855f7;}
.stat.good{background:var(--good-soft);} .stat.warn{background:var(--warn-soft);} .stat.bad{background:var(--bad-soft);}
.stat .sv{font-size:18px;}
.sec-h3 h3{font-size:14px;border-left:4px solid var(--accent);padding-left:10px;}
.cbox .cb{font-size:13px;}
</style>
<style>
/* ---- design v7: premium pass ---- */
.ktiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:12px;}
.kt{background:var(--surface);border:1px solid color-mix(in srgb,var(--border) 70%,transparent);border-radius:13px;padding:10px 14px;box-shadow:var(--shadow);}
.kt .ktl{display:block;font-size:9px;font-weight:800;color:var(--ink-3);letter-spacing:.06em;margin-bottom:2px;}
.kt .ktv{font-family:"Inter",var(--mono);font-size:22px;font-weight:800;letter-spacing:-.02em;}
.fband{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid color-mix(in srgb,var(--border) 70%,transparent);border-left:4px solid #7c5cf0;border-radius:13px;padding:12px 16px;margin-bottom:12px;font-size:12.5px;line-height:1.8;}
.fband .fbl{flex:none;font-size:9px;font-weight:800;letter-spacing:.12em;color:#7c5cf0;padding-top:3px;}
.hb{display:grid;grid-template-columns:120px 1fr 56px 74px;gap:12px;align-items:center;padding:7px 0;}
.hb .hl{font-size:12.5px;font-weight:700;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hb .htrack{height:14px;border-radius:7px;background:var(--surface-3);overflow:hidden;
  background-image:linear-gradient(90deg,transparent calc(60% - 1px),var(--border-strong) calc(60% - 1px),var(--border-strong) 60%,transparent 60%);}
.hb .htrack i{display:block;height:100%;border-radius:7px;}
.hb .hv{font-family:"Inter",var(--mono);font-size:13px;font-weight:800;text-align:right;}
.hb .hv2{font-size:10.5px;color:var(--ink-3);font-family:"Inter",var(--mono);text-align:right;}
.repta{width:100%;min-height:300px;border:1px solid var(--border-strong);border-radius:11px;padding:14px;
  font-family:var(--mono);font-size:12px;line-height:1.8;color:var(--ink);background:var(--surface-2);resize:vertical;box-sizing:border-box;}
.ltile{display:inline-flex;align-items:center;justify-content:center;border-radius:9px;overflow:hidden;flex:none;border:1px solid color-mix(in srgb,var(--border) 65%,transparent);}
.ltile img{width:100%;height:100%;display:block;}
.ltile.fcontain img{object-fit:contain;padding:4px;box-sizing:border-box;}
.ltile.fcover img{object-fit:cover;}
.ltile.mono{background:var(--grad);color:#fff;font-weight:800;border:none;border-radius:50%;}
.ltile.mono.tl{background:linear-gradient(135deg,#7E22CE,#c084fc);}
.cent.draft{background:transparent!important;border:1.5px dashed var(--border-strong);}
.cent.draft .ct{color:var(--ink-2);font-weight:600;}
.dlabel{display:inline-block;font-size:8.5px;font-weight:800;border:1px solid var(--warn);color:var(--warn-ink);border-radius:4px;padding:0 4px;margin-right:4px;vertical-align:1px;letter-spacing:.03em;}
.draftd{font-size:9.5px;color:var(--warn-ink);font-weight:700;margin-top:1px;}
:root{ --grad:linear-gradient(135deg,#4a57c9 0%,#7c5cf0 60%,#a855f7 100%); }
body{background:
  radial-gradient(1200px 500px at 85% -10%, rgba(124,92,240,.07), transparent 60%),
  radial-gradient(900px 400px at -10% 0%, rgba(74,87,201,.06), transparent 55%),
  var(--bg);}
body::before{content:'';position:fixed;top:0;left:0;right:0;height:3px;background:var(--grad);z-index:99;}
.num,.kov,.stat .sv,.kp2,.kv2{font-family:"Inter",var(--mono);}
header{position:sticky;top:0;z-index:50;margin:-24px -20px 18px;padding:14px 20px;
  background:color-mix(in srgb, var(--bg) 78%, transparent);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);}
.badge{background:var(--grad);color:#fff;letter-spacing:.16em;padding:4px 10px;border-radius:7px;box-shadow:0 2px 8px rgba(99,82,230,.35);}
h1{font-size:19px;font-weight:800;letter-spacing:-.02em;}
.sub{font-size:11px;}
.tabs{background:var(--surface);border-radius:13px;padding:4px;box-shadow:var(--shadow);}
.tabs button{border-radius:9px;font-weight:800;color:var(--ink-3);}
.tabs button.on{background:var(--grad);color:#fff;box-shadow:0 3px 10px rgba(99,82,230,.35);}
.tabs button.on .ic{stroke:#fff;}
.panel,.kcard,.scard,.cbox{border-radius:16px;}
.panel{box-shadow:0 1px 2px rgba(20,24,33,.04), 0 8px 28px rgba(20,24,33,.05);}
.kcard,.scard{box-shadow:0 1px 2px rgba(20,24,33,.04), 0 6px 22px rgba(20,24,33,.06);border-color:color-mix(in srgb, var(--border) 70%, transparent);}
.scard:hover{box-shadow:0 4px 10px rgba(99,82,230,.12), 0 16px 40px rgba(20,24,33,.12);}
.kcard .kov{font-size:25px;font-weight:800;}
.stat{border:1px solid color-mix(in srgb, var(--border) 60%, transparent);}
.stat .sv{font-size:19px;font-weight:800;}
.sec-h3 h3{border-left:none;padding-left:0;font-size:14.5px;}
.sec-h3 h3::before{content:'';display:inline-block;width:22px;height:4px;border-radius:2px;background:var(--grad);margin-right:9px;vertical-align:3px;}
.sec-h3 .line{background:color-mix(in srgb, var(--border) 80%, transparent);}
.switch{border-radius:11px;}
.switch button{border-radius:8px;}
.btn{border-radius:10px;transition:.15s;}
.btn:hover{border-color:var(--accent);color:var(--accent-ink);}
.cal .ch{padding:8px 0;letter-spacing:.1em;}
.cday{transition:background .15s;}
.cday:hover{background:color-mix(in srgb, var(--surface) 90%, var(--accent) 10%);}
.cday.today{outline:2px solid transparent;border-radius:2px;box-shadow:inset 0 0 0 2px #7c5cf0;}
.cday.today .dnum{background:var(--grad);}
.ovbar{height:7px;}
.ovbar i{background:var(--grad);}
.ovbar i.b-warn{background:linear-gradient(90deg,#d67d12,#f0a83a);}
.ovbar i.b-bad{background:linear-gradient(90deg,#dd3b3b,#f26a6a);}
.cvmark{background:var(--grad);}
.krow2.cvrow{background:color-mix(in srgb, var(--accent-soft) 75%, transparent);border:1px solid color-mix(in srgb, var(--accent) 22%, transparent);}
footer{font-size:10.5px;}
::-webkit-scrollbar{height:8px;width:8px;}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px;}
@media (prefers-color-scheme:dark){
  body{background:
    radial-gradient(1200px 500px at 85% -10%, rgba(124,92,240,.10), transparent 60%),
    radial-gradient(900px 400px at -10% 0%, rgba(74,87,201,.08), transparent 55%),
    var(--bg);}
  .panel{box-shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 34px rgba(0,0,0,.35);}
}
/* ---- v14: school hub clarity ---- */
.steaser.tzr{color:var(--ink-2);font-weight:700;font-size:11.5px;line-height:1.7;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:10px;}
.cbox.full{grid-column:1/-1;}
.cbox.hero{border-left:4px solid var(--accent);background:linear-gradient(135deg,color-mix(in srgb,var(--accent-soft) 55%,var(--surface)) 0%,var(--surface) 70%);}
.cbox.hero .cb{font-size:15px;line-height:2;}
.mrow{display:flex;gap:12px;padding:6.5px 0;border-bottom:1px dashed var(--border);font-size:12.5px;line-height:1.75;}
.mrow:last-child{border-bottom:none;}
.mrow b{flex:none;width:132px;color:var(--accent-ink);font-weight:800;}
.mrow span{flex:1;min-width:0;color:var(--ink);font-weight:600;}
@media (max-width:600px){ .mrow{flex-direction:column;gap:2px;} .mrow b{width:auto;} }
/* ---- v15: KPI行を横1行レイアウト（カード幅が広いとき） ---- */
.kcard{container-type:inline-size;}
@container (min-width:520px){
  .krow2{display:grid;grid-template-columns:minmax(180px,1.2fr) max-content minmax(70px,1fr) 64px max-content;gap:4px 14px;align-items:center;}
  .krow2 .kn2{flex:none;white-space:normal;}
  .krow2 .kv2{text-align:right;}
  .krow2 .kbar{width:auto;}
  .krow2 .kp2{justify-self:end;}
  .krow2.cvrow{padding:9px 12px;}
}
.kmn{font-family:"Inter",var(--mono);font-size:10.5px;font-weight:700;color:var(--ink-3);white-space:nowrap;text-align:right;}
/* ---- v16: 左サイドバー＋CVタイル ---- */
.layout{display:grid;grid-template-columns:216px minmax(0,1fr);max-width:1400px;margin:0 auto;}
#side{position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;padding:18px 12px 30px;border-right:1px solid var(--border);}
.sidebrand{display:flex;align-items:center;gap:8px;padding:2px 8px 12px;}
.sidebrand .bt{font-size:11.5px;font-weight:800;letter-spacing:.02em;line-height:1.4;}
.snav{display:flex;flex-direction:column;gap:2px;margin-bottom:8px;}
.snav .nl{font-size:9.5px;font-weight:800;color:var(--ink-3);letter-spacing:.1em;margin:12px 8px 4px;}
.snav button{display:flex;align-items:center;gap:8px;border:none;background:transparent;text-align:left;font-size:12.5px;font-weight:700;color:var(--ink-2);padding:7px 10px;border-radius:9px;width:100%;}
.snav button .ic{margin:0;flex:none;}
.snav button.on{background:var(--grad);color:#fff;box-shadow:0 3px 10px rgba(99,82,230,.3);}
.snav button.on .ic{stroke:#fff;}
.snav button:hover:not(.on){background:var(--surface-2);color:var(--ink);}
.snav button .ltile{flex:none;}
.snav button .tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.kt.cvt{border-left:3px solid var(--accent);}
.kt .ktt{font-size:11px;color:var(--ink-3);font-weight:700;margin-left:4px;font-family:"Inter",var(--mono);}
.kt .ktp{display:block;font-size:10.5px;font-weight:800;margin-top:1px;}
@media (max-width:900px){ .layout{display:block;} #side{display:none;} }
@media (min-width:901px){ #tabs{display:none;} }
/* ---- v17: インフォマ（放送カレンダー／台本・配信進行） ---- */
.cent.infm{background:#F6EEFF!important;box-shadow:inset 0 0 0 1.5px #a855f7;}
.cent.infm .ct{color:#4c1d95;}
.ibadge{display:inline-block;font-size:8.5px;font-weight:800;padding:1px 6px;border-radius:5px;background:#7E22CE;color:#fff;letter-spacing:.04em;vertical-align:1px;margin-right:4px;white-space:nowrap;}
.ibadge.k2{background:#0e7490;}
.ibadge.k3{background:#4b5563;}
.ialert{display:inline-block;font-family:"Inter",var(--mono);font-size:11px;font-weight:800;padding:1.5px 9px;border-radius:999px;white-space:nowrap;}
.ialert.a-bad{background:var(--bad-soft);color:var(--bad-ink);}
.ialert.a-warn{background:var(--warn-soft);color:var(--warn-ink);}
.ialert.a-good{background:var(--good-soft);color:var(--good-ink);}
.ialert.a-none{background:var(--surface-3);color:var(--ink-3);}
.fixrow.inf .tc{color:#6b21a8;background:#F3E8FF;}
@media (prefers-color-scheme:dark){
  .cent.infm{background:#2a1b3d!important;}
  .cent.infm .ct{color:#e9d5ff;}
  .fixrow.inf .tc{color:#d8b4fe;background:#2d1b45;}
}
/* ---- v18: ロゴ＋レイアウトの伸び止め ---- */
.brand{display:inline-flex;align-items:center;gap:9px;border:none;background:transparent;padding:0;text-decoration:none;color:inherit;}
.bmark{display:block;border-radius:7px;background:#000;box-shadow:0 2px 8px rgba(0,0,0,.3);flex:none;}
.sidebrand{flex-direction:column;align-items:flex-start;gap:9px;padding:2px 6px 14px;border-bottom:1px solid var(--border);margin-bottom:4px;}
.sidebrand .bt{color:var(--ink);}

/* 横伸び対策：中身の少ないブロックが画面幅いっぱいに間延びしないよう上限を持たせる */
.layout{max-width:1340px;}
.wrap{max-width:1100px;padding:20px 24px 56px;}
#side{background:color-mix(in srgb,var(--surface) 55%,transparent);}
.ktiles{display:flex;flex-wrap:wrap;gap:10px;}
.kt{flex:1 1 158px;max-width:228px;}
.sec-h3{margin:20px 0 9px;}
.cbox .cb,.cbox.hero .cb{max-width:80ch;}
.mrow span{max-width:74ch;}
.fband{max-width:none;}
.note{max-width:88ch;}

/* スクール詳細＝広い画面では2カラム（縦に伸びすぎるのを止める） */
.detgrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:0 20px;align-items:start;}
.detgrid .dcol{min-width:0;}
.detgrid .sec-h3:first-child{margin-top:14px;}
@media (max-width:1240px){ .detgrid{grid-template-columns:minmax(0,1fr);} }

/* 一覧カードも間延びしないよう列幅を固定寄りに */
.sgrid{grid-template-columns:repeat(auto-fill,minmax(238px,1fr));}
.kgrid{grid-template-columns:repeat(auto-fill,minmax(340px,1fr));}

/* ---- v19: カレンダーを「本物のカレンダー」に ---- */
.layout{max-width:1420px;}
body.wideview .wrap{max-width:1200px;}

.calhead{padding:14px 18px;gap:12px;}
.calhead .cm{font-size:17px;font-weight:800;min-width:132px;letter-spacing:-.01em;}
.cal{min-width:1010px;}
.cal .ch{padding:9px 0;font-size:10px;letter-spacing:.18em;}

/* min-width:0 が無いとグリッドのマスが「折り返さないタイトル」の幅まで広がり、
   カレンダー全体が横にはみ出して金・土が切れる */
.cday{min-height:104px;padding:7px 6px 8px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0;}
.cday>*{min-width:0;max-width:100%;}
.cent{min-width:0;}
.cday.out{cursor:default;}
.cday .dhead{display:flex;align-items:center;gap:4px;margin-bottom:2px;}
.cday .dnum{font-size:12.5px;font-weight:800;color:var(--ink-2);width:23px;height:23px;}
.cday .dcnt{margin-left:auto;font-size:9px;font-weight:800;color:var(--ink-3);letter-spacing:.03em;padding-right:2px;}
.cday.sel{box-shadow:inset 0 0 0 2px var(--accent);}
.cday.sel.today{box-shadow:inset 0 0 0 2px var(--accent),inset 0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent);}

/* イベントチップ＝1行・省略記号。詳細は日付クリックで下に開く */
.cent{margin-top:0;padding:4px 7px 4px 7px;border-radius:6px;border-left:3px solid transparent;}
.cent .ct{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11.5px;line-height:1.6;}
.cent .ctime{font-family:"Inter",var(--mono);font-size:10px;font-weight:800;opacity:.7;margin-right:4px;}
.cmore{border:none;background:transparent;color:var(--ink-2);font-size:10.5px;font-weight:800;
  padding:2px 6px;border-radius:6px;text-align:left;width:100%;}
.cmore:hover{background:var(--surface-3);color:var(--ink);}

/* ---- v21: 予定リスト＝日付でまとめるアジェンダ表示 ---- */
.agday{border-bottom:1px solid var(--border);}
.agday:last-child{border-bottom:none;}
.agdh{display:flex;align-items:baseline;gap:9px;padding:13px 0 6px;}
.agdd{font-family:"Inter",var(--mono);font-size:16px;font-weight:800;color:var(--ink);letter-spacing:-.01em;}
.agdw{font-size:11.5px;font-weight:800;color:var(--ink-3);}
.agdh.sun .agdd,.agdh.sun .agdw{color:var(--bad-ink);}
.agdh.sat .agdd,.agdh.sat .agdw{color:var(--accent-ink);}
.agdn{margin-left:auto;font-size:10.5px;font-weight:800;color:var(--ink-3);}
.agtoday{font-size:9.5px;font-weight:800;background:var(--grad);color:#fff;padding:2px 8px;border-radius:999px;letter-spacing:.06em;}
.agsoon{font-size:9.5px;font-weight:800;background:var(--warn-soft);color:var(--warn-ink);padding:2px 8px;border-radius:999px;}
.agrow{display:flex;gap:12px;align-items:flex-start;padding:8px 0 9px 2px;}
.agrow+.agrow{border-top:1px dashed var(--border);}
.agtime{flex:none;width:46px;font-family:"Inter",var(--mono);font-size:13px;font-weight:800;color:var(--ink-2);padding-top:1px;}
.agtime.none{color:var(--ink-3);font-size:11px;font-weight:700;}
.agmain{flex:1;min-width:0;}
.agt{font-size:13.5px;font-weight:700;color:var(--ink);line-height:1.55;}
.agmeta{font-size:11.5px;color:var(--ink-2);font-weight:600;margin-top:3px;line-height:1.55;}
.agmeta b{color:var(--ink-3);font-weight:800;font-size:10px;margin-right:4px;letter-spacing:.04em;}
.agmeta .sep{color:var(--border-strong);margin:0 7px;}
.agst{flex:none;display:flex;align-items:center;gap:6px;padding-top:1px;}

/* 残りの fixrow も薄さ・小ささを解消 */
.fixrow{font-size:13px;padding:9px 0;}
.fixrow .fx{font-weight:700;line-height:1.55;}
.fixrow .fx small{color:var(--ink-2);font-weight:600;}
.fixrow .tc{font-size:11px;}

/* 選択日の詳細パネル */
.dayp{margin-top:14px;}
.dayp .dph{display:flex;align-items:baseline;gap:10px;padding:13px 18px 4px;}
.dayp .dpd{font-size:16px;font-weight:800;letter-spacing:-.01em;}
.dayp .dpn{font-size:11px;color:var(--ink-3);font-weight:700;}
.dayp .fixrow{padding:9px 18px;}
.dayp .fixrow:last-child{border-bottom:none;}
.dayp .close{margin-left:auto;}
.dpempty{padding:6px 18px 16px;}

/* ---- v24: 週表示（スイムレーン）＝案件×7日。月表示は俯瞰、週表示は実務用 ---- */
.wkhead{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.wkhead .wm{font-size:16px;font-weight:800;min-width:190px;letter-spacing:-.01em;}
.wkwrap{overflow-x:auto;}
.wkgrid{min-width:1080px;display:grid;grid-template-columns:162px repeat(7,minmax(0,1fr));gap:1px;background:var(--border);}
.wkh{background:var(--surface-2);padding:7px 4px 8px;text-align:center;min-width:0;}
.wkh .wd{display:block;font-size:9.5px;font-weight:800;color:var(--ink-3);letter-spacing:.12em;}
.wkh .wn{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 6px;margin-top:2px;
  font-family:"Inter",var(--mono);font-size:14px;font-weight:800;border-radius:999px;}
.wkh.sun .wd{color:var(--bad-ink);} .wkh.sat .wd{color:var(--accent-ink);}
.wkh.today .wn{background:var(--grad);color:#fff;}
.wkh.corner{background:var(--surface-2);position:sticky;left:0;z-index:3;}
.wklbl{background:var(--surface-2);padding:9px 10px;display:flex;align-items:center;gap:8px;min-width:0;
  position:sticky;left:0;z-index:2;border-right:1px solid var(--border);}
.wklbl .wnm{font-size:12px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.wkrow-empty .wklbl .wnm{color:var(--ink-3);font-weight:700;}
.wkc{background:var(--surface);padding:6px 6px 7px;min-height:76px;display:flex;flex-direction:column;gap:4px;min-width:0;cursor:pointer;}
.wkc.wknd{background:color-mix(in srgb,var(--surface) 94%,var(--accent) 6%);}
.wkc.today{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 45%,transparent);}
.wkc.sel{box-shadow:inset 0 0 0 2px var(--accent);}
.wkrow-empty .wkc{min-height:34px;}
.wke{border-radius:6px;padding:4px 7px;font-size:11.5px;line-height:1.5;font-weight:700;color:#2b2e33;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;min-width:0;}
.wke .wkt{font-family:"Inter",var(--mono);font-size:10px;font-weight:800;opacity:.72;margin-right:4px;}
.wke.infm{background:#F6EEFF;box-shadow:inset 0 0 0 1.5px #a855f7;color:#4c1d95;}
.wke.draft{background:transparent;border:1.5px dashed var(--border-strong);color:var(--ink-2);font-weight:600;}
.wke.done{opacity:.68;}
@media (prefers-color-scheme:dark){ .wke.infm{background:#2a1b3d;color:#e9d5ff;} }

/* 月表示（すべて表示時）＝件数サマリーに切り替えて俯瞰に徹する */
.csum{display:flex;align-items:center;gap:6px;border-radius:6px;padding:3px 7px;background:var(--surface-2);font-size:11px;font-weight:700;min-width:0;}
.csum .cs-d{width:8px;height:8px;border-radius:2px;flex:none;}
.csum .cs-n{margin-left:auto;font-family:"Inter",var(--mono);font-weight:800;color:var(--ink-2);}
.csum .cs-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);}

/* ---- v25: 進捗チェック＋FIXまでのマイルストーン ---- */
.chk{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:4px;
  border:1.6px solid var(--border-strong);font-size:10px;font-weight:900;line-height:1;flex:none;
  background:transparent;color:transparent;vertical-align:-3px;margin-right:5px;}
.chk.s-none{border-style:dashed;}
.chk.s-prog{border-color:var(--warn);background:linear-gradient(0deg,var(--warn) var(--fill,50%),transparent var(--fill,50%));}
.chk.s-wait{border-color:var(--good);color:var(--good);}
.chk.s-done{border-color:var(--good);background:var(--good);color:#fff;}

.msrow{display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap;}
.ms{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--ink-3);
  background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:2px 10px 2px 5px;white-space:nowrap;}
.ms b{font-family:"Inter",var(--mono);color:var(--ink-2);font-weight:800;}
.ms .msb{display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;border-radius:3px;
  border:1.4px solid var(--border-strong);font-size:8px;font-weight:900;font-style:normal;color:transparent;flex:none;}
.ms.ok{color:var(--good-ink);background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 30%,transparent);}
.ms.ok .msb{background:var(--good);border-color:var(--good);color:#fff;}
.ms.ok b{color:var(--good-ink);}
.ms.late{color:var(--bad-ink);background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 32%,transparent);}
.ms.late .msb{border-color:var(--bad);}
.ms.late b{color:var(--bad-ink);}
.msar{color:var(--ink-3);font-style:normal;font-size:12px;font-weight:700;}
.agmeta .msrow{margin-top:2px;}
.fixrow .msrow{margin-top:4px;}

/* ---- v26: 角丸を落として文字を大きく（森本「文字・フォント・タグが丸くてみづらい」） ---- */
/* タグ/バッジ類＝ピル(999px)と大きい角丸をやめ、四角に近い3pxへ。8.5pxの極小文字も10px以上に */
.stag{border-radius:3px;font-size:12px;padding:3px 10px;letter-spacing:.01em;}
.mb{border-radius:3px;font-size:10px;padding:2px 6px;letter-spacing:.02em;}
.sctag{border-radius:3px;font-size:10px;padding:2px 6px;}
.ibadge{border-radius:3px;font-size:10px;padding:2px 7px;}
.dlabel{border-radius:3px;font-size:10px;padding:1px 5px;}
.chk{border-radius:3px;}
.ms{border-radius:3px;font-size:11px;padding:2px 8px 2px 5px;gap:4px;}
.msrow{gap:4px;}
.ms .msb{border-radius:2px;}
.lchip{border-radius:3px;font-size:11px;padding:2px 8px;}
.cent .lchip{font-size:10px;}
.ialert{border-radius:3px;font-size:11.5px;padding:2px 9px;}
.agtoday,.agsoon{border-radius:3px;font-size:10.5px;padding:2px 8px;}
.krow2 .kp2{border-radius:3px;}
.kt .ktp{font-size:11px;}
.kt .ktl,.stat .sl,.kovlbl{font-size:10px;letter-spacing:.05em;}
.cday .dcnt{font-size:10px;}
.csum{border-radius:3px;font-size:11.5px;}
.csum .cs-d{border-radius:2px;}

/* チップ・セル・カードの角丸も控えめに */
.cent,.wke,.mrow,.cmore{border-radius:3px;}
.panel,.kcard,.scard,.cbox,.kt,.fband,.dayp{border-radius:6px;}
.tabs,.switch,.tabs button,.switch button,.btn,.snav button{border-radius:5px;}
.badge,.bmark{border-radius:4px;}
.ltile{border-radius:4px;}
.ltile.mono{border-radius:4px;}
.stat,.kbar,.kbar i,.ovbar,.ovbar i,.hb .htrack,.hb .htrack i{border-radius:3px;}
.cday .dnum,.wkh .wn{border-radius:4px;}
.repta{border-radius:5px;}

/* 本文まわりも一段大きく */
.cent .ct{font-size:12px;}
.wke{font-size:12px;}
.agt{font-size:14px;}
.agmeta{font-size:12px;}
.agmeta b{font-size:10.5px;}
.fixrow{font-size:13.5px;}
.wklbl .wnm{font-size:12.5px;}
table{font-size:13px;}
th{font-size:10.5px;}

/* ---- v27: 進捗チェックを「枠＋段階の文字」に（塗り具合は読み取れなかった） ---- */
.chk{width:18px;height:18px;border-radius:3px;border:1.6px solid var(--border-strong);
  font-family:var(--sans);font-size:10.5px;font-weight:800;line-height:1;
  display:inline-flex;align-items:center;justify-content:center;flex:none;
