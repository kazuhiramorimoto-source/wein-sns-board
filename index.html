<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<title>WEIN スクール横串オーガニック｜スケジュール & KPI進捗</title>
<style>
  :root{
    --bg:#eef1f5; --surface:#ffffff; --surface-2:#f4f6f9; --surface-3:#e7ebf1;
    --border:#dee3ea; --border-strong:#c5ccd7;
    --ink:#181b21; --ink-2:#565e6c; --ink-3:#8b93a2;
    --accent:#4a57c9; --accent-soft:#e9ebfb; --accent-ink:#3742a1;
    --good:#1a9d5b; --good-soft:#e3f4eb; --good-ink:#127a45;
    --warn:#d67d12; --warn-soft:#fbeed8; --warn-ink:#985807;
    --bad:#dd3b3b; --bad-soft:#fbe7e7; --bad-ink:#b32424;
    --shadow:0 1px 2px rgba(20,24,33,.05); --shadow-lg:0 12px 34px rgba(20,24,33,.14);
    --mono:"SF Mono",ui-monospace,Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",YuGothic,"Noto Sans JP",sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0f1216; --surface:#171b21; --surface-2:#1e232b; --surface-3:#272d38;
      --border:#2b323d; --border-strong:#3c4450;
      --ink:#eef1f6; --ink-2:#a3abb9; --ink-3:#69717f;
      --accent:#8b9bff; --accent-soft:#1e2842; --accent-ink:#b6c2ff;
      --good:#3ed07e; --good-soft:#132a1e; --good-ink:#5fe19b;
      --warn:#f0a83a; --warn-soft:#30250f; --warn-ink:#f7c574;
      --bad:#f26a6a; --bad-soft:#331717; --bad-ink:#f79290;
      --shadow:0 1px 2px rgba(0,0,0,.45); --shadow-lg:0 12px 40px rgba(0,0,0,.6);
    }
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;
    -webkit-font-smoothing:antialiased;font-feature-settings:"palt" 1;font-size:14px;}
  .wrap{max-width:1180px;margin:0 auto;padding:24px 20px 90px;}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums;}
  button{font-family:var(--sans);cursor:pointer;}

  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
  .badge{background:var(--ink);color:var(--surface);font-size:10px;font-weight:800;letter-spacing:.13em;padding:3px 8px;border-radius:6px;}
  h1{font-size:17px;font-weight:800;margin:0;letter-spacing:-.01em;}
  .sub{font-size:10.5px;color:var(--ink-3);}
  .spacer{flex:1;}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:7px;white-space:nowrap;}
  .pill .d{width:6px;height:6px;border-radius:50%;}
  .p-done{background:var(--good-soft);color:var(--good-ink)} .p-done .d{background:var(--good)}

  .tabs{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:3px;gap:2px;margin-bottom:16px;flex-wrap:wrap;}
  .tabs button{border:none;background:transparent;color:var(--ink-2);font-size:12.5px;font-weight:700;padding:7px 14px;border-radius:8px;}
  .tabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);}
  .switch{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:2px;gap:2px;flex-wrap:wrap;}
  .switch button{border:none;background:transparent;font-size:11px;font-weight:700;color:var(--ink-3);padding:4px 11px;border-radius:7px;white-space:nowrap;}
  .switch button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);}
  .btn{border:1px solid var(--border-strong);background:var(--surface);color:var(--ink-2);font-size:12px;font-weight:700;padding:6px 12px;border-radius:9px;}

  .stag{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:2px 10px;border-radius:6px;color:#3d3d3d;border:1px solid rgba(0,0,0,.1);}
  .mb{display:inline-block;font-size:8.5px;font-weight:800;padding:1px 6px;border-radius:5px;background:var(--surface-3);color:var(--ink-2);letter-spacing:.03em;vertical-align:1px;white-space:nowrap;}
  .mb-x{background:#1a1a1a;color:#fff;}
  @media (prefers-color-scheme:dark){ .mb-x{background:#e8e8e8;color:#111;} }
  .mb-yt{background:#FDE3E1;color:#B3211B;} .mb-sh{background:#FCE7F3;color:#BE185D;}
  .sctag{display:inline-block;font-size:8.5px;font-weight:800;padding:1px 6px;border-radius:5px;background:var(--accent-soft);color:var(--accent-ink);white-space:nowrap;vertical-align:1px;}
  .sctag.tl{background:#F3E8FF;color:#7E22CE;}
  @media (prefers-color-scheme:dark){ .sctag.tl{background:#2d1b45;color:#d0aaff;} }
  .segrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;width:100%;}
  .seglbl{font-size:9.5px;font-weight:800;color:var(--ink-3);letter-spacing:.08em;min-width:64px;}

  /* calendar */
  .calhead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .calhead .cm{font-size:14.5px;font-weight:800;min-width:110px;text-align:center;}
  .calwrap{overflow-x:auto;}
  .cal{min-width:880px;display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);}
  .cal .ch{background:var(--surface-2);font-size:10px;font-weight:800;color:var(--ink-3);text-align:center;padding:6px 0;}
  .cal .ch.sun{color:var(--bad-ink)} .cal .ch.sat{color:var(--accent-ink)}
  .cday{background:var(--surface);min-height:112px;padding:5px 6px;font-size:11px;}
  .cday.out{background:var(--surface-2);}
  .cday .dnum{font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--ink-3);display:inline-flex;width:19px;height:19px;align-items:center;justify-content:center;border-radius:50%;}
  .cday.today .dnum{background:var(--accent);color:#fff;}
  .cent{display:block;margin-top:4px;line-height:1.45;background:var(--surface-2);border-left:3px solid var(--border-strong);border-radius:5px;padding:3px 6px;}
  .cent .ct{color:var(--ink);font-weight:600;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .cent .ct b{color:var(--ink);}

  /* list */
  .grp-h2{font-size:11px;font-weight:800;color:var(--ink-3);letter-spacing:.05em;padding:14px 18px 6px;}
  .tbl-scroll{overflow-x:auto;}
  table{border-collapse:collapse;width:100%;font-size:12px;}
  th,td{text-align:left;padding:9px 13px;border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:top;}
  th{font-size:9.5px;color:var(--ink-3);font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--surface-2);}
  tr:last-child td{border-bottom:none;}
  td.wr{white-space:normal;min-width:200px;max-width:360px;line-height:1.5;color:var(--ink);font-weight:600;}

  /* KPI */
  .kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px;}
  .kcard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:15px 17px;}
  .kcard .kh2{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .kcard .knm{font-size:15px;font-weight:800;letter-spacing:-.01em;}
  .kcard .kov{margin-left:auto;font-family:var(--mono);font-size:21px;font-weight:750;letter-spacing:-.02em;}
  .krow2{display:flex;gap:9px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--border);font-size:12px;}
  .krow2:last-child{border-bottom:none;}
  .krow2 .kn2{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2);font-weight:600;}
  .krow2 .kn2.cv{color:var(--accent-ink);font-weight:800;}
  .krow2 .kv2{font-family:var(--mono);font-size:11.5px;color:var(--ink);white-space:nowrap;}
  .krow2 .kv2 b{font-size:13.5px;}
  .krow2 .kv2 .tgt{color:var(--ink-3);font-size:10px;}
  .kbar{width:64px;height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;flex:none;}
  .kbar i{display:block;height:100%;border-radius:3px;}
  .b-good{background:var(--good)} .b-warn{background:var(--warn)} .b-bad{background:var(--bad)} .b-none{background:var(--ink-3)}
  .krow2 .kp2{font-family:var(--mono);font-size:12.5px;font-weight:800;min-width:52px;text-align:right;flex:none;}
  .kovwrap{margin-left:auto;text-align:right;flex:none;}
  .kovlbl{display:block;font-size:8.5px;font-weight:800;color:var(--ink-3);letter-spacing:.05em;}
  .c-good{color:var(--good-ink)} .c-warn{color:var(--warn-ink)} .c-bad{color:var(--bad-ink)} .c-none{color:var(--ink-3)}
  .note{font-size:11px;color:var(--ink-3);margin:10px 2px;line-height:1.7;}
  /* スクールハブ */
  .sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;}
  .scard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:15px 17px;cursor:pointer;transition:.15s;box-shadow:var(--shadow);}
  .scard:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow-lg);}
  .scard .sn2{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px;letter-spacing:-.01em;}
  .scard .sn2 .kov{margin-left:auto;font-size:16px;}
  .scard .steaser{font-size:10.5px;color:var(--ink-3);margin-top:9px;line-height:1.6;}
  .statrow{display:flex;gap:10px;margin-top:10px;}
  .stat{flex:1;background:var(--surface-2);border-radius:9px;padding:7px 11px;}
  .stat .sl{display:block;font-size:8.5px;font-weight:800;color:var(--ink-3);letter-spacing:.04em;margin-bottom:1px;}
  .stat .sv{font-family:var(--mono);font-size:17px;font-weight:750;letter-spacing:-.02em;}
  .sd-head{display:flex;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap;}
  .sd-head h2{font-size:21px;font-weight:800;margin:0;letter-spacing:-.01em;}
  .concept-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;}
  .cbox{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;}
  .cbox.hero{grid-column:1/-1;border-color:var(--accent);}
  .cbox .ci{font-size:10px;font-weight:800;letter-spacing:.07em;color:var(--accent-ink);margin-bottom:7px;text-transform:uppercase;}
  .cbox .cb{font-size:12.5px;line-height:1.85;color:var(--ink);white-space:pre-wrap;}
  .cbox.hero .cb{font-size:14px;font-weight:600;}
  .sec-h3{display:flex;align-items:baseline;gap:10px;margin:24px 0 10px;}
  .sec-h3 h3{font-size:13px;font-weight:800;margin:0;letter-spacing:.02em;}
  .sec-h3 .line{flex:1;height:1px;background:var(--border);}
  .fixrow{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px;}
  .fixrow:last-child{border-bottom:none;}
  .fixrow .tc{flex:none;font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);padding:1px 7px;border-radius:5px;margin-top:2px;}
  .fixrow .fx{flex:1;line-height:1.5;color:var(--ink);font-weight:600;min-width:0;}
  .fixrow .fx small{color:var(--ink-3);font-weight:500;}
  footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--border);font-size:10.5px;color:var(--ink-3);line-height:1.8;}
</style>
<style>

.dmk{display:inline-block;width:13px;height:13px;border-radius:50%;background:#3a3f47;color:#fff;font-size:9px;font-weight:800;line-height:13px;text-align:center;margin-right:5px;vertical-align:-1.5px;}
.dmk::after{content:'✓';}

.ic{width:15px;height:15px;vertical-align:-2.5px;margin-right:5px;}
.tabs .ic{width:16px;height:16px;}
.cvmark{display:inline-block;font-size:8.5px;font-weight:800;background:var(--accent);color:#fff;border-radius:4px;padding:1px 5px;margin-right:5px;vertical-align:1px;letter-spacing:.05em;}
.gdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:0;}

body{font-size:14.5px;}
h1{font-size:18px;}

.grp-h2{font-size:12px;color:var(--ink-2);}
td.wr{font-size:12.5px;}
tbody tr:nth-child(even){background:color-mix(in srgb, var(--surface-2) 55%, var(--surface) 45%);}
.krow2{font-size:12.5px;padding:8px 0;}
.krow2 .kv2 b{font-size:14.5px;}
.kbar{width:88px;height:8px;border-radius:4px;}
.krow2 .kp2{font-size:13.5px;min-width:56px;}
.krow2.cvrow{background:var(--accent-soft);border-radius:8px;padding:8px 10px;border-bottom:none;margin:3px -4px;}
.ovbar{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;margin:2px 0 10px;}
.ovbar i{display:block;height:100%;border-radius:3px;}
.kcard .kov{font-size:23px;}
.kcard .knm{font-size:16px;}
.lgd{display:inline-flex;gap:12px;align-items:center;flex-wrap:wrap;}
.lgi{display:inline-flex;gap:5px;align-items:center;font-size:10.5px;font-weight:700;color:var(--ink-2);}
.lgi .ld{width:10px;height:10px;border-radius:3px;display:inline-block;}
.scard.sc{border-top:3px solid var(--accent);}
.scard.tl{border-top:3px solid #a855f7;}
.stat.good{background:var(--good-soft);} .stat.warn{background:var(--warn-soft);} .stat.bad{background:var(--bad-soft);}
.stat .sv{font-size:18px;}
.sec-h3 h3{font-size:14px;border-left:4px solid var(--accent);padding-left:10px;}
.cbox .cb{font-size:13px;}
</style>
<style>
/* ---- design v7: premium pass ---- */
:root{ --grad:linear-gradient(135deg,#4a57c9 0%,#7c5cf0 60%,#a855f7 100%); }
body{background:
  radial-gradient(1200px 500px at 85% -10%, rgba(124,92,240,.07), transparent 60%),
  radial-gradient(900px 400px at -10% 0%, rgba(74,87,201,.06), transparent 55%),
  var(--bg);}
body::before{content:'';position:fixed;top:0;left:0;right:0;height:3px;background:var(--grad);z-index:99;}
.num,.kov,.stat .sv,.kp2,.kv2{font-family:"Inter",var(--mono);}
header{position:sticky;top:0;z-index:50;margin:-24px -20px 18px;padding:14px 20px;
  background:color-mix(in srgb, var(--bg) 78%, transparent);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);}
.badge{background:var(--grad);color:#fff;letter-spacing:.16em;padding:4px 10px;border-radius:7px;box-shadow:0 2px 8px rgba(99,82,230,.35);}
h1{font-size:19px;font-weight:800;letter-spacing:-.02em;}
.sub{font-size:11px;}
.tabs{background:var(--surface);border-radius:13px;padding:4px;box-shadow:var(--shadow);}
.tabs button{border-radius:9px;font-weight:800;color:var(--ink-3);}
.tabs button.on{background:var(--grad);color:#fff;box-shadow:0 3px 10px rgba(99,82,230,.35);}
.tabs button.on .ic{stroke:#fff;}
.panel,.kcard,.scard,.cbox{border-radius:16px;}
.panel{box-shadow:0 1px 2px rgba(20,24,33,.04), 0 8px 28px rgba(20,24,33,.05);}
.kcard,.scard{box-shadow:0 1px 2px rgba(20,24,33,.04), 0 6px 22px rgba(20,24,33,.06);border-color:color-mix(in srgb, var(--border) 70%, transparent);}
.scard:hover{box-shadow:0 4px 10px rgba(99,82,230,.12), 0 16px 40px rgba(20,24,33,.12);}
.kcard .kov{font-size:25px;font-weight:800;}
.stat{border:1px solid color-mix(in srgb, var(--border) 60%, transparent);}
.stat .sv{font-size:19px;font-weight:800;}
.sec-h3 h3{border-left:none;padding-left:0;font-size:14.5px;}
.sec-h3 h3::before{content:'';display:inline-block;width:22px;height:4px;border-radius:2px;background:var(--grad);margin-right:9px;vertical-align:3px;}
.sec-h3 .line{background:color-mix(in srgb, var(--border) 80%, transparent);}
.switch{border-radius:11px;}
.switch button{border-radius:8px;}
.btn{border-radius:10px;transition:.15s;}
.btn:hover{border-color:var(--accent);color:var(--accent-ink);}
.cal .ch{padding:8px 0;letter-spacing:.1em;}
.cday{transition:background .15s;}
.cday:hover{background:color-mix(in srgb, var(--surface) 90%, var(--accent) 10%);}
.cday.today{outline:2px solid transparent;border-radius:2px;box-shadow:inset 0 0 0 2px #7c5cf0;}
.cday.today .dnum{background:var(--grad);}
.ovbar{height:7px;}
.ovbar i{background:var(--grad);}
.ovbar i.b-warn{background:linear-gradient(90deg,#d67d12,#f0a83a);}
.ovbar i.b-bad{background:linear-gradient(90deg,#dd3b3b,#f26a6a);}
.cvmark{background:var(--grad);}
.krow2.cvrow{background:color-mix(in srgb, var(--accent-soft) 75%, transparent);border:1px solid color-mix(in srgb, var(--accent) 22%, transparent);}
footer{font-size:10.5px;}
::-webkit-scrollbar{height:8px;width:8px;}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px;}
@media (prefers-color-scheme:dark){
  body{background:
    radial-gradient(1200px 500px at 85% -10%, rgba(124,92,240,.10), transparent 60%),
    radial-gradient(900px 400px at -10% 0%, rgba(74,87,201,.08), transparent 55%),
    var(--bg);}
  .panel{box-shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 34px rgba(0,0,0,.35);}
}
</style>

<body>
<div class="wrap">
  <header>
    <span class="badge">WEIN</span>
    <div><h1>スクール横串オーガニック｜スケジュール & KPI進捗</h1><div class="sub" id="subline"></div></div>
    <div class="spacer"></div>
    <span class="pill p-done"><span class="d"></span>閲覧用ボード</span>
  </header>
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
  <footer>
    WEIN スクール横串オーガニック ─ 全スクール・案件の投稿スケジュールとKPI進捗の共有ボード（閲覧専用）。<br>
    データはWEIN_SNS運用スケジュール／KPI横断まとめのスナップショットです。スケジュールは直近1週間＋今後の予定のみ表示（過去分は省略）。
  </footer>
</div>

<script>
var B = window.BOARD;
var SCHOOL_SET={"HERO'ZZ":1,"CREATOR'ZZ":1,"RVA":1,"AI+":1,"MERISE":1};
B.sched.forEach(function(c){ if(!c.seg) c.seg = SCHOOL_SET[c.name]?'school':'talent'; });
var curTab='schools', schedMode='cal', curCase='ALL', kpiSeg='all', curSchool=null;
var calCur=null;
var STATUS_COLORS={'撮影':'#FCE5CD','編集':'#FFF2CC','修正中':'#F4CCCC','社内確認中':'#D9D2E9','納品':'#CFE2F3','投稿済':'#D9D9D9','企画/台本':'#DDEBF7','共通':'#ECEFF3'};
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function $(id){return document.getElementById(id);}
function svgw(p){return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';}
var IC={
 school: svgw('<rect x="4" y="3" width="16" height="18" rx="1.5"/><path d="M9 21v-4h6v4M8.5 7.5h1.5M14 7.5h1.5M8.5 11.5h1.5M14 11.5h1.5M8.5 15.5h1.5M14 15.5h1.5"/>'),
 cal: svgw('<rect x="3" y="4.5" width="18" height="16.5" rx="2"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/>'),
 chart: svgw('<path d="M4 20v-8M10 20V5M16 20v-5M21 20.5H3"/>'),
 all: svgw('<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3.2 3.6 3.2 14.4 0 18M12 3c-3.2 3.6-3.2 14.4 0 18"/>'),
 users: svgw('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.5" cy="9" r="2.6"/><path d="M16 14.4c3 .3 5.5 2.4 5.5 5.6"/>'),
 list: svgw('<path d="M8.5 6h12M8.5 12h12M8.5 18h12M3.8 6h.01M3.8 12h.01M3.8 18h.01"/>'),
 chevL: svgw('<path d="M14.5 6l-6 6 6 6"/>'),
 chevR: svgw('<path d="M9.5 6l6 6-6 6"/>')
};

function stag(st,extra){var c=STATUS_COLORS[st]||'#ECEFF3';var fg=st==='投稿済'?'#606060':'#3d3d3d';
  return '<span class="stag" style="background:'+c+';color:'+fg+'">'+esc(st||'予定')+(extra||'')+'</span>';}
function mediaBadge(m){
  if(m==='X投稿')return '<span class="mb mb-x">X</span>';
  if(m==='ロング動画')return '<span class="mb mb-yt">ロング</span>';
  if(m==='ショート動画')return '<span class="mb mb-sh">ショート</span>';
  return m?'<span class="mb">'+esc(m)+'</span>':'';}
function pd(s){var m=/^(\d{1,2})\/(\d{1,2})/.exec(String(s||'').trim());if(!m)return null;return new Date(B.year,+m[1]-1,+m[2]);}

function isAgg(){ return curCase==='ALL'||curCase==='SCHOOL'||curCase==='TALENT'; }
function allRows(){
  var out=[];
  B.sched.forEach(function(c){
    if(curCase==='SCHOOL' && c.seg!=='school') return;
    if(curCase==='TALENT' && c.seg!=='talent') return;
    if(!isAgg() && c.name!==curCase) return;
    c.rows.forEach(function(r){ out.push({sc:c.name,seg:c.seg,date:r[0],time:r[1],title:r[2],media:r[3],status:r[4],editor:r[5]}); });
  });
  return out;
}

function render(){
  $('subline').textContent = B.updated+' 時点のスナップショット';
  var tabs=[{k:'schools',l:IC.school+'スクール'},{k:'sched',l:IC.cal+'スケジュール'},{k:'kpi',l:IC.chart+'KPI進捗'}];
  $('tabs').innerHTML=tabs.map(function(t){return '<button type="button" class="'+(curTab===t.k?'on':'')+'" onclick="curTab=\''+t.k+'\';render()">'+t.l+'</button>';}).join('');
  if(curTab==='schools') renderSchools();
  else if(curTab==='sched') renderSched();
  else renderKpi();
}

/* ---------- スクールハブ ---------- */
function schoolKpi(name){ var hit=null; B.kpi.forEach(function(k){ if(k.name===name) hit=k; }); return hit; }
function schoolAch(kc){ if(!kc) return null; var pr=[];
  kc.kpis.forEach(function(k){ var t=numv(k[1]),pace=numv(k[2]),a=numv(k[3]); if(t&&pace&&a!==null) pr.push(Math.min(a/pace,3)); });
  return pr.length?Math.round(pr.reduce(function(x,y){return x+y;},0)/pr.length*100):null; }
function openSchoolIdx(i){ curSchool=B.sched[i].name; curTab='schools'; render(); }
function openCal(i){ curCase=B.sched[i].name; curTab='sched'; schedMode='cal'; curSchool=null; render(); }
function sh3(t){ return '<div class="sec-h3"><h3>'+t+'</h3><span class="line"></span></div>'; }
function schoolMonthAch(kc){ if(!kc) return null; var ar=[];
  kc.kpis.forEach(function(k){ var t=numv(k[1]),a=numv(k[3]); if(t&&a!==null) ar.push(Math.min(a/t,1)); });
  return ar.length?Math.round(ar.reduce(function(x,y){return x+y;},0)/ar.length*100):null; }
function renderSchools(){
  if(curSchool) return renderSchoolDetail();
  var t0=new Date(); t0.setHours(0,0,0,0);
  function card(c,i){
    var kc=schoolKpi(c.name);
    var pace=schoolAch(kc), month=schoolMonthAch(kc);
    var pst=pace===null?'none':pace>=100?'good':pace>=60?'warn':'bad';
    var up=c.rows.filter(function(r){ var d=pd(r[0]); return d&&d>=t0; }).length;
    return '<div class="scard '+(c.seg==='talent'?'tl':'sc')+'" onclick="openSchoolIdx('+i+')"><div class="sn2">'+esc(c.name)+
      '<span class="sctag'+(c.seg==='talent'?' tl':'')+'" style="margin-left:auto">'+(c.seg==='talent'?'非スクール':'スクール')+'</span></div>'+
      '<div class="statrow">'+
      '<span class="stat '+pst+'"><span class="sl">現時点達成率</span><span class="sv c-'+pst+'">'+(pace===null?'—':pace+'%')+'</span></span>'+
      '<span class="stat"><span class="sl">月間達成率</span><span class="sv" style="color:var(--ink)">'+(month===null?'—':month+'%')+'</span></span></div>'+
      '<div class="steaser">今後の予定 '+up+'件 ／ タップで詳細</div></div>';
  }
  var sHtml='', tHtml='';
  B.sched.forEach(function(c,i){ if(c.seg==='school') sHtml+=card(c,i); else tHtml+=card(c,i); });
  $('view').innerHTML=sh3('スクール')+'<div class="sgrid">'+sHtml+'</div>'+
    sh3('非スクール（タレント・案件）')+'<div class="sgrid">'+tHtml+'</div>'+
    '<p class="note"><b>現時点達成率</b>＝現在実績÷今日までのペース目標／<b>月間達成率</b>＝現在実績÷月間目標（いずれも各KPIの平均）。スクール5校はコンセプト設計付き。</p>';
}
function renderSchoolDetail(){
  var name=curSchool, sc=null, idx=0;
  B.sched.forEach(function(c,i){ if(c.name===name){ sc=c; idx=i; } });
  if(!sc){ curSchool=null; return renderSchools(); }
  var kc=schoolKpi(name), con=(B.concepts||{})[name]||[];
  var pace=schoolAch(kc), month=schoolMonthAch(kc);
  var pst=pace===null?'none':pace>=100?'good':pace>=60?'warn':'bad';
  var head='<div class="sd-head"><button class="btn" type="button" onclick="curSchool=null;render()">← 一覧</button><h2>'+esc(name)+'</h2>'+
    '<span class="kovwrap" style="text-align:left"><span class="kovlbl">現時点達成率</span><span class="kov c-'+pst+'" style="font-size:19px">'+(pace===null?'—':pace+'%')+'</span></span>'+
    '<span class="kovwrap" style="text-align:left"><span class="kovlbl">月間達成率</span><span class="kov" style="font-size:19px;color:var(--ink)">'+(month===null?'—':month+'%')+'</span></span>'+
    '<span class="spacer"></span><button class="btn" type="button" onclick="openCal('+idx+')">'+IC.cal+'カレンダーで見る</button></div>';
  var conceptHtml=con.length
    ? '<div class="concept-g">'+con.map(function(c,i){
        return '<div class="cbox'+(i===0?' hero':'')+'"><div class="ci">'+esc(c[0])+'</div><div class="cb">'+esc(c[1])+'</div></div>';
      }).join('')+'</div>'
    : '<p class="note">この案件のコンセプト設計は準備中です。</p>';
  var kpiHtml=kc?'<div class="kgrid">'+kpiCardHtml(kc)+'</div>':'<p class="note">KPIは未設定です。</p>';
  var t0=new Date(); t0.setHours(0,0,0,0);
  var up=[], und=[];
  sc.rows.forEach(function(r){ var d=pd(r[0]); if(!d){ und.push(r); return; } if(d>=t0) up.push([d,r]); });
  up.sort(function(a,b){ return a[0]-b[0]; });
  var rows=up.slice(0,20).map(function(x){ var d=x[0], r=x[1];
    return '<div class="fixrow"><span class="tc num">'+(d.getMonth()+1)+'/'+d.getDate()+(r[1]?' '+esc(r[1]):'')+'</span>'+
      '<div class="fx">'+mediaBadge(r[3])+' '+esc(r[2])+(r[5]?'<small>／ '+esc(r[5])+'</small>':'')+'</div>'+(r[4]==='投稿済'?'<span class="dmk"></span>':r[4]==='納品'?'<span class="dmk half"></span>':'')+(r[4]?stag(r[4]):'')+'</div>';
  }).join('');
  var undRows=und.map(function(r){
    return '<div class="fixrow"><span class="tc">未定</span><div class="fx">'+mediaBadge(r[3])+' '+esc(r[2])+'</div>'+(r[4]==='投稿済'?'<span class="dmk"></span>':r[4]==='納品'?'<span class="dmk half"></span>':'')+(r[4]?stag(r[4]):'')+'</div>';
  }).join('');
  var schedHtml='<div class="panel" style="padding:12px 16px">'+
    (rows||'<p class="note" style="margin:4px 0">今後の投稿予定はまだ入っていません。</p>')+undRows+
    (up.length>20?'<p class="note" style="margin:8px 0 0">ほか '+(up.length-20)+' 件は「カレンダーで見る」から。</p>':'')+'</div>';
  $('view').innerHTML=head+
    sh3('コンセプト設計')+conceptHtml+
    sh3('KPI進捗 — 現時点達成率（今日までのペース目標比）')+kpiHtml+
    sh3('今後の投稿スケジュール — 期日が近い順')+schedHtml;
}

function setCase(i){ curCase = (i==='ALL'||i==='SCHOOL'||i==='TALENT')?i:B.sched[i].name; renderSched(); }
function calShift(n){ calCur.m+=n; if(calCur.m<0){calCur.m=11;calCur.y--;} if(calCur.m>11){calCur.m=0;calCur.y++;} renderSched(); }
function calToday(){ var t=new Date(); calCur={y:t.getFullYear(),m:t.getMonth()}; renderSched(); }

function renderSched(){
  if(!calCur){ var t=new Date(); calCur={y:B.year,m:t.getMonth()}; }
  function segBtns(seg){
    return B.sched.map(function(c,i){ if(c.seg!==seg) return '';
      return '<button type="button" class="'+(c.seg==='talent'?'tl':'sc')+(curCase===c.name?' on':'')+'" onclick="setCase('+i+')">'+esc(c.name)+'</button>'; }).join('');
  }
  var segAll='<span class="switch">'+
    '<button type="button" class="'+(curCase==='ALL'?'on':'')+'" onclick="setCase(\'ALL\')">'+IC.all+'すべて</button>'+
    '<button type="button" class="'+(curCase==='SCHOOL'?'on':'')+'" onclick="setCase(\'SCHOOL\')">'+IC.school+'スクール全体</button>'+
    '<button type="button" class="'+(curCase==='TALENT'?'on':'')+'" onclick="setCase(\'TALENT\')">'+IC.users+'非スクール全体</button></span>';
  var mode='<span class="switch"><button type="button" class="'+(schedMode==='cal'?'on':'')+'" onclick="schedMode=\'cal\';renderSched()">'+IC.cal+'カレンダー</button>'+
    '<button type="button" class="'+(schedMode==='list'?'on':'')+'" onclick="schedMode=\'list\';renderSched()">'+IC.list+'リスト</button></span>';
  var rows=allRows();
  var body = schedMode==='cal' ? calHtml(rows) : listHtml(rows);
  $('view').innerHTML='<div class="panel"><div class="bar">'+segAll+mode+'</div>'+
    '<div class="bar" style="padding-top:8px;padding-bottom:8px"><span class="segrow"><span class="seglbl">スクール</span><span class="switch">'+segBtns('school')+'</span></span></div>'+
    '<div class="bar" style="padding-top:8px;padding-bottom:8px"><span class="segrow"><span class="seglbl">非スクール</span><span class="switch">'+segBtns('talent')+'</span></span></div>'+'<div class="bar" style="padding-top:8px;padding-bottom:8px;row-gap:6px"><span class="seglbl">色＝制作状況</span>'+
    '<span class="stag" style="background:#DDEBF7">企画/台本</span><span class="stag" style="background:#FCE5CD">撮影</span><span class="stag" style="background:#FFF2CC">編集</span><span class="stag" style="background:#F4CCCC">修正中</span><span class="stag" style="background:#D9D2E9">社内確認中</span><span class="stag" style="background:#CFE2F3"><span class="dmk half" style="margin-right:4px"></span>納品=投稿待ち</span><span class="stag" style="background:#D9D9D9;color:#606060"><span class="dmk" style="margin-right:4px"></span>投稿済=完了</span></div>'+body+'</div>'+
    '<p class="note">チップの色は運用スケジュールシートの「状況」と同じ色です。</p>';
}

function calHtml(rows){
  var y=calCur.y,m=calCur.m,byDay={};
  rows.forEach(function(r){var d=pd(r.date);if(d&&d.getFullYear()===y&&d.getMonth()===m){(byDay[d.getDate()]=byDay[d.getDate()]||[]).push(r);}});
  var first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
  var tnow=new Date(),thisMonth=tnow.getFullYear()===y&&tnow.getMonth()===m;
  var cells='';
  ['日','月','火','水','木','金','土'].forEach(function(w,i){cells+='<div class="ch'+(i===0?' sun':i===6?' sat':'')+'">'+w+'</div>';});
  for(var i=0;i<first;i++)cells+='<div class="cday out"></div>';
  for(var d=1;d<=days;d++){
    var ents=(byDay[d]||[]).map(function(r){
      var c=STATUS_COLORS[r.status]||'#e8ecf2';
      return '<div class="cent'+(r.status==='投稿済'?' done':'')+'" style="background:'+c+'" title="'+esc(r.title)+'（'+esc(r.sc)+'・'+esc(r.status||'予定')+(r.editor?'・'+esc(r.editor):'')+'）">'+
        '<span class="ct">'+(r.status==='投稿済'?'<span class="dmk"></span>':r.status==='納品'?'<span class="dmk half"></span>':'')+(r.time?'<b class="num">'+esc(r.time)+'</b> ':'')+
        (isAgg()?'<span class="sctag'+(r.seg==='talent'?' tl':'')+'">'+esc(r.sc)+'</span> ':'')+mediaBadge(r.media)+' '+esc(r.title)+'</span></div>';
    }).join('');
    var dow=(first+d-1)%7;
    cells+='<div class="cday'+(thisMonth&&tnow.getDate()===d?' today':'')+((dow===0||dow===6)?' wk':'')+'"><span class="dnum">'+d+'</span>'+ents+'</div>';
  }
  var rem=(first+days)%7; if(rem)for(var j=rem;j<7;j++)cells+='<div class="cday out"></div>';
  return '<div class="calhead"><button class="btn" type="button" onclick="calShift(-1)">'+IC.chevL+'前月</button><span class="cm">'+y+'年'+(m+1)+'月</span>'+
    '<button class="btn" type="button" onclick="calShift(1)">翌月'+IC.chevR+'</button><button class="btn" type="button" onclick="calToday()">今日</button></div>'+
    '<div class="calwrap"><div class="cal">'+cells+'</div></div>';
}

function listHtml(rows){
  var t0=new Date();t0.setHours(0,0,0,0);
  var undated=[],up=[],past=[];
  rows.forEach(function(r){var d=pd(r.date);
    if(!d){ if(r.title) undated.push(r); return; }
    r._d=d;(d>=t0?up:past).push(r);});
  up.sort(function(a,b){return a._d-b._d;});
  past.sort(function(a,b){return b._d-a._d;});
  function tr(r){var d=r._d;
    var ds=d?(d.getMonth()+1)+'/'+d.getDate()+'（'+'日月火水木金土'.charAt(d.getDay())+'）':'—';
    return '<tr><td class="num">'+ds+(r.time?' '+esc(r.time):'')+'</td>'+
      (isAgg()?'<td><span class="sctag'+(r.seg==='talent'?' tl':'')+'">'+esc(r.sc)+'</span></td>':'')+
      '<td class="wr">'+esc(r.title)+'</td><td>'+mediaBadge(r.media)+'</td><td>'+(r.status==='投稿済'?'<span class="dmk"></span>':r.status==='納品'?'<span class="dmk half"></span>':'')+stag(r.status)+'</td><td>'+esc(r.editor||'')+'</td></tr>';}
  function sec(title,arr){if(!arr.length)return '';
    return '<div class="grp-h2">'+title+'</div><div class="tbl-scroll"><table><thead><tr><th>投稿日</th>'+
      (isAgg()?'<th>案件</th>':'')+'<th>コンテンツ</th><th>媒体</th><th>状況</th><th>担当</th></tr></thead><tbody>'+arr.map(tr).join('')+'</tbody></table></div>';}
  return sec('<span class="gdot" style="background:var(--accent)"></span>今後の予定 — 期日が近い順（'+up.length+'件）',up)+
    sec('<span class="gdot" style="background:var(--warn)"></span>日付未定・制作中（'+undated.length+'件）',undated)+
    sec('<span class="gdot" style="background:var(--good)"></span>直近の投稿済み — 新しい順（'+past.length+'件）',past);
}

function numv(x){ return (x===null||x===undefined||x==='')?null:+x; }
function kst(t,pace,a){ if(t===null||t===0||a===null)return 'none'; if(!pace)return a>0?'good':'none'; var r=a/pace; return r>=1?'good':r>=0.6?'warn':'bad'; }
function kpiCardHtml(c){
  var pr=[];
  var rows=c.kpis.map(function(k){
    var t=numv(k[1]),pace=numv(k[2]),a=numv(k[3]);
    var st=kst(t,pace,a);
    var ratio=(pace&&a!==null)?a/pace:null;
    if(t&&ratio!==null) pr.push(Math.min(ratio,3));
    var w=ratio!==null?Math.min(Math.max(ratio*100,0),100):0;
    var isCv=/LINE|面談/.test(k[0]);
    var pct=ratio!==null?Math.round(ratio*100)+'%':'—';
    return '<div class="krow2'+(isCv?' cvrow':'')+'"><span class="kn2'+(isCv?' cv':'')+'" title="月間目標 '+(t===null?'—':t.toLocaleString())+'">'+(isCv?'<span class="cvmark">CV</span>':'')+esc(k[0])+'</span>'+
      '<span class="kv2"><b>'+(a===null?'—':a.toLocaleString())+'</b><span class="tgt"> /月間 '+(t===null?'—':t.toLocaleString())+'</span></span>'+
      '<span class="kbar"><i class="b-'+st+'" style="width:'+w+'%"></i></span><span class="kp2 c-'+st+'">'+pct+'</span></div>';
  }).join('');
  var avg=pr.length?Math.round(pr.reduce(function(x,y){return x+y;},0)/pr.length*100):null;
  var ost=avg===null?'none':avg>=100?'good':avg>=60?'warn':'bad';
  return '<div class="kcard"><div class="kh2"><span class="knm">'+esc(c.name)+'</span>'+
    '<span class="kovwrap"><span class="kovlbl">現時点達成率</span><span class="kov c-'+ost+'">'+(avg===null?'—':avg+'%')+'</span></span></div>'+
    '<div class="ovbar"><i class="b-'+ost+'" style="width:'+(avg===null?0:Math.min(avg,100))+'%"></i></div>'+rows+'</div>';
}
function renderKpi(){
  var seg='<span class="switch">'+[['all','すべて'],['school','スクール'],['talent','タレント']].map(function(x){
    return '<button type="button" class="'+(kpiSeg===x[0]?'on':'')+'" onclick="kpiSeg=\''+x[0]+'\';renderKpi()">'+x[1]+'</button>';}).join('')+'</span>';
  var cases=B.kpi.filter(function(c){return kpiSeg==='all'||c.seg===kpiSeg;});
  var cards=cases.map(kpiCardHtml).join('');
  $('view').innerHTML='<div class="panel" style="margin-bottom:14px"><div class="bar">'+seg+
    '<span class="lgd"><span class="lgi"><i class="ld b-good"></i>順調 100%〜</span><span class="lgi"><i class="ld b-warn"></i>注意 60%〜</span><span class="lgi"><i class="ld b-bad"></i>要対応 〜60%</span></span>'+
    '<span class="spacer"></span><span class="note" style="margin:0">'+esc(B.kpiBasis)+'</span></div></div>'+
    '<div class="kgrid">'+cards+'</div>'+
    '<p class="note"><b>%＝現時点達成率</b>（現在実績 ÷ 今日までのペース目標）。<span class="c-good" style="font-weight:800">100%以上＝順調</span>／<span class="c-warn" style="font-weight:800">60%以上＝注意</span>／<span class="c-bad" style="font-weight:800">60%未満＝要対応</span>。「/月間」＝月間目標。<span class="cvmark">CV</span>＝コンバージョン（LINE登録・面談予約）。カード右上＝各KPIの現時点達成率の平均です。</p>';
}
render();
</script>
</body>
</html>
