name: Update board data
on:
  schedule:
    - cron: '30 22 * * *'   # 毎朝 7:30 JST（KPI自動集計 6:00 JST の後）
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install cryptography
      - name: Build data.enc.js from Google Sheets
        env:
          GOOGLE_OAUTH: ${{ secrets.GOOGLE_OAUTH }}
          BOARD_PASSWORD: ${{ secrets.BOARD_PASSWORD }}
        run: python scripts/build_data.py
      - name: Notify losses (Issue with counts only)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=snapshots/watch_summary.txt
          if [ -s "$f" ]; then
            gh issue create --title "⚠️ スケジュール変更監視 $(date +'%Y-%m-%d'): 前日比で消えた行・リンクあり" \
              --body "$(printf '件数のみ（内容はボードのスケジュールタブ「変更監視」で確認）:\n\n%s\n\n%s' "$(cat $f)" 'https://tinyurl.com/wein-sns-board')" || true
          fi
      - name: Commit & push if changed
        run: |
          git config user.name 'board-bot'
          git config user.email 'board-bot@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && echo 'no changes' || (git commit -m "auto: 毎朝のデータ更新 $(date +'%Y-%m-%d')" && git push)
